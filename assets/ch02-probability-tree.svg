<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-labelledby="title desc">
  <title id="title">Probability tree for total probability and Bayes theorem</title>
  <desc id="desc">A partition branches into prior events, then evidence and its complement; path products are joint probabilities and evidence paths sum to total probability.</desc>
  <style>
    text{font:600 14px system-ui,sans-serif;fill:#24292f}.small{font-size:12px;font-weight:500}.line{stroke:#57606a;stroke-width:2}.evidence{stroke:#1f6feb;stroke-width:4}.node{fill:#57606a}.note{fill:#f6f8fa;stroke:#57606a;stroke-width:1.5}
    @media(prefers-color-scheme:dark){text{fill:#c9d1d9}.line{stroke:#8b949e}.evidence{stroke:#58a6ff}.node{fill:#8b949e}.note{fill:#161b22;stroke:#8b949e}}
  </style>
  <circle class="node" cx="45" cy="135" r="5"/><text x="25" y="120">start</text>
  <line class="line" x1="45" y1="135" x2="265" y2="65"/><line class="line" x1="45" y1="135" x2="265" y2="205"/><text class="small" x="130" y="82">P(A₁)</text><text class="small" x="130" y="202">P(A₂)</text><text x="275" y="70">A₁</text><text x="275" y="210">A₂</text>
  <line class="evidence" x1="295" y1="65" x2="520" y2="30"/><line class="line" x1="295" y1="65" x2="520" y2="100"/><line class="evidence" x1="295" y1="205" x2="520" y2="170"/><line class="line" x1="295" y1="205" x2="520" y2="240"/>
  <text class="small" x="380" y="35">P(B | A₁)</text><text class="small" x="380" y="105">P(B′ | A₁)</text><text class="small" x="380" y="175">P(B | A₂)</text><text class="small" x="380" y="245">P(B′ | A₂)</text><text x="530" y="35">B</text><text x="530" y="105">B′</text><text x="530" y="175">B</text><text x="530" y="245">B′</text>
  <rect class="note" x="600" y="38" width="275" height="82" rx="8"/><text x="618" y="65">Path product = joint probability</text><text class="small" x="618" y="91">P(Aᵢ ∩ B) = P(Aᵢ)P(B | Aᵢ)</text>
  <rect class="note" x="600" y="145" width="275" height="82" rx="8"/><text x="618" y="172">Add blue paths for P(B)</text><text class="small" x="618" y="198">Bayes: one blue path ÷ all blue paths</text>
</svg>
