<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" role="img" aria-labelledby="title desc">
  <title id="title">Choosing a counting rule</title>
  <desc id="desc">A decision diagram selecting the product rule for successive stages and permutations or combinations when selecting objects.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" class="arrow"/></marker></defs>
  <style>
    text{font:600 14px system-ui,sans-serif;fill:#24292f}.small{font-size:12px;font-weight:500}.box{fill:#f6f8fa;stroke:#57606a;stroke-width:2}.choice{fill:#ddf4ff;stroke:#0969da;stroke-width:2}.line{fill:none;stroke:#57606a;stroke-width:2;marker-end:url(#arrow)}.arrow{fill:#57606a}
    @media(prefers-color-scheme:dark){text{fill:#c9d1d9}.box{fill:#161b22;stroke:#8b949e}.choice{fill:#0d419d;stroke:#58a6ff}.line{stroke:#8b949e}.arrow{fill:#8b949e}}
  </style>
  <rect class="box" x="25" y="80" width="170" height="70" rx="8"/><text x="110" y="108" text-anchor="middle">Counting problem</text><text class="small" x="110" y="130" text-anchor="middle">what is the structure?</text>
  <path class="line" d="M195 100 C235 100 240 50 290 50"/><text class="small" x="220" y="67">stages</text>
  <rect class="choice" x="290" y="20" width="185" height="60" rx="8"/><text x="382" y="45" text-anchor="middle">Product rule</text><text class="small" x="382" y="65" text-anchor="middle">n₁n₂ ··· nₖ</text>
  <path class="line" d="M195 130 C235 130 240 165 290 165"/><text class="small" x="210" y="159">select k from n</text>
  <rect class="box" x="290" y="135" width="185" height="60" rx="8"/><text x="382" y="161" text-anchor="middle">Does order matter?</text><text class="small" x="382" y="181" text-anchor="middle">without replacement</text>
  <path class="line" d="M475 150 C520 150 530 95 590 95"/><text class="small" x="510" y="117">yes</text>
  <rect class="choice" x="590" y="65" width="270" height="60" rx="8"/><text x="725" y="90" text-anchor="middle">Permutation</text><text class="small" x="725" y="110" text-anchor="middle">Pₖ,ₙ = n!/(n−k)!</text>
  <path class="line" d="M475 180 C520 180 530 190 590 190"/><text class="small" x="520" y="176">no</text>
  <rect class="choice" x="590" y="160" width="270" height="60" rx="8"/><text x="725" y="185" text-anchor="middle">Combination</text><text class="small" x="725" y="205" text-anchor="middle">n choose k = n!/[k!(n−k)!]</text>
</svg>