<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" role="img" aria-labelledby="title desc">
  <title id="title">Modified boxplot anatomy</title>
  <desc id="desc">A horizontal boxplot labeled with quartiles, median, interquartile range, whiskers, mild outlier, and extreme outlier.</desc>
  <style>
    text{font:600 14px system-ui,sans-serif;fill:#24292f}.small{font-size:12px;font-weight:500}.line,.tick{stroke:#57606a;stroke-width:2;fill:none}.box{fill:#ddf4ff;stroke:#0969da;stroke-width:2}.median{stroke:#cf222e;stroke-width:4}.mild{fill:#bf8700}.extreme{fill:none;stroke:#cf222e;stroke-width:3}
    @media(prefers-color-scheme:dark){text{fill:#c9d1d9}.line,.tick{stroke:#8b949e}.box{fill:#0d419d;stroke:#58a6ff}.median{stroke:#ff7b72}.mild{fill:#d29922}.extreme{stroke:#ff7b72}}
  </style>
  <line class="line" x1="80" y1="110" x2="240" y2="110"/><line class="line" x1="600" y1="110" x2="710" y2="110"/>
  <line class="tick" x1="80" y1="85" x2="80" y2="135"/><line class="tick" x1="710" y1="85" x2="710" y2="135"/>
  <rect class="box" x="240" y="65" width="360" height="90" rx="3"/><line class="median" x1="420" y1="65" x2="420" y2="155"/>
  <circle class="mild" cx="770" cy="110" r="7"/><circle class="extreme" cx="840" cy="110" r="8"/>
  <text x="80" y="48" text-anchor="middle">lower whisker</text><text x="240" y="48" text-anchor="middle">lower fourth</text><text x="420" y="48" text-anchor="middle">median</text><text x="600" y="48" text-anchor="middle">upper fourth</text><text x="710" y="48" text-anchor="middle">upper whisker</text>
  <text x="420" y="180" text-anchor="middle">fourth spread fₛ</text><text class="small" x="770" y="140" text-anchor="middle">mild</text><text class="small" x="840" y="140" text-anchor="middle">extreme</text>
</svg>
